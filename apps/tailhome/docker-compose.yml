services:
  dashboard:
    image: gcr.io/distroless/static-debian12
    container_name: tailhome-dashboard
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${TAILHOME_HOMEPAGE_PORT:-3000}:3000"
    volumes:
      - ${TAILHOME_BIN_DIR:-/usr/local/bin}/tailhome:/usr/local/bin/tailhome:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale:/var/run/tailscale:ro
      - /proc:/host/proc:ro
      - ./configs/dashboard:/app/config:ro
    environment:
      TAILHOME_USE_SUDO: "0"
      TAILHOME_DIR: /app
      TAILHOME_DASHBOARD_CONFIG: /app/config
      TAILHOME_HOSTNAME: ${TAILHOME_HOSTNAME:-tailhome}
      TAILHOME_DOCKER_SOCKET: /var/run/docker.sock
      TAILHOME_TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
      TAILHOME_PROC_ROOT: /host/proc
      TAILHOME_HOST_ROOT: /
      TAILHOME_PROMETHEUS_URL: http://prometheus:9090
      TAILHOME_LISTEN: :3000
    entrypoint: ["/usr/local/bin/tailhome"]
    command: ["serve"]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:latest
    container_name: tailhome-grafana
    restart: unless-stopped
    ports:
      - "${TAILHOME_GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${TAILHOME_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${TAILHOME_GRAFANA_PASSWORD:-tailhome}

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: tailhome-prometheus
    restart: unless-stopped
    ports:
      - "${TAILHOME_PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:latest
    container_name: tailhome-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=:${TAILHOME_NODE_EXPORTER_PORT:-9100}"

  uptime-kuma:
    profiles: ["uptime"]
    image: louislam/uptime-kuma:1
    container_name: tailhome-uptime-kuma
    restart: unless-stopped
    ports:
      - "${TAILHOME_UPTIME_PORT:-3002}:3001"
    volumes:
      - uptime-kuma-data:/app/data

  portainer:
    profiles: ["management"]
    image: portainer/portainer-ce:lts
    container_name: tailhome-portainer
    restart: unless-stopped
    ports:
      - "${TAILHOME_PORTAINER_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  caddy:
    image: caddy:2
    container_name: tailhome-caddy
    restart: unless-stopped
    ports:
      - "${TAILHOME_CADDY_HTTP_PORT:-8088}:80"
      - "${TAILHOME_CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  pihole:
    profiles: ["dns"]
    image: pihole/pihole:latest
    container_name: tailhome-pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${TAILHOME_PIHOLE_WEB_PORT:-8080}:80/tcp"
    environment:
      TZ: ${TAILHOME_TIMEZONE:-UTC}
      FTLCONF_webserver_api_password: ${TAILHOME_PIHOLE_PASSWORD:-tailhome}
      FTLCONF_dns_listeningMode: all
    volumes:
      - pihole-etc:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN

volumes:
  grafana-data:
  prometheus-data:
  uptime-kuma-data:
  portainer-data:
  caddy-data:
  caddy-config:
  pihole-etc:
  pihole-dnsmasq:
