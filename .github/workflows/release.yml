name: Release

# Direct pushes to main, merged PRs (GitHub records those as pushes to main),
# version tags, and manual runs from main all publish CLI binaries.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ startsWith(github.ref, 'refs/tags/v') && github.ref || 'main-latest' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  test:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/tailhome/go.mod

      - name: Test CLI
        working-directory: apps/tailhome
        run: go test ./...

  prepare-release:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release.outputs.release_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_body: ${{ steps.release.outputs.release_body }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
      generate_notes: ${{ steps.release.outputs.generate_notes }}
    steps:
      - name: Resolve release target
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "release_name=TailHome ${tag}" >> "${GITHUB_OUTPUT}"
            echo "release_body=" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "make_latest=true" >> "${GITHUB_OUTPUT}"
            echo "generate_notes=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          tag="main-latest"
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=TailHome latest from main" >> "${GITHUB_OUTPUT}"
          echo "release_body=Rolling CLI build from ${GITHUB_SHA} on main." >> "${GITHUB_OUTPUT}"
          echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          echo "make_latest=false" >> "${GITHUB_OUTPUT}"
          echo "generate_notes=false" >> "${GITHUB_OUTPUT}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}"
          fi

  release:
    needs: prepare-release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/tailhome/go.mod

      - name: Build release binaries
        working-directory: apps/tailhome
        run: |
          mkdir -p ../../dist
          build() {
            goos="$1"
            goarch="$2"
            goarm="$3"
            asset="$4"

            echo "Building ${asset}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" GOARM="${goarm}" \
              go build -trimpath -ldflags="-s -w" -o "../../dist/${asset}" ./cmd/tailhome
          }

          build linux amd64 "" tailhome-linux-amd64
          build linux arm64 "" tailhome-linux-arm64
          build linux arm 7 tailhome-linux-armv7
          build linux arm 6 tailhome-linux-armv6
          build darwin amd64 "" tailhome-darwin-amd64
          build darwin arm64 "" tailhome-darwin-arm64
          build windows amd64 "" tailhome-windows-amd64.exe
          build windows arm64 "" tailhome-windows-arm64.exe

          cd ../../dist
          sha256sum tailhome-* > checksums.txt
          for asset in tailhome-*; do
            if [[ "${asset}" != *.sha256 && "${asset}" != "checksums.txt" ]]; then
              sha256sum "${asset}" > "${asset}.sha256"
            fi
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare-release.outputs.release_name }}
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          body: ${{ needs.prepare-release.outputs.release_body }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/tailhome-*
            dist/checksums.txt
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare-release.outputs.make_latest }}
          generate_release_notes: ${{ needs.prepare-release.outputs.generate_notes == 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
